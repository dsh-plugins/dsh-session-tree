name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build package
        run: pnpm run build
      - name: Regression tests
        run: pnpm test
      - name: Inspect npm package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Test release version bump
        run: node --test scripts/bump-next-patch.test.mjs

  publish:
    name: Publish to npm
    needs: quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve publish version
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version 必须是稳定的 X.Y.Z，实际为 $BASE_VERSION"
            exit 1
          fi

          if [[ "$REF_TYPE" == "branch" ]]; then
            PUBLISH_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_ID}"
            DIST_TAG="next"
            node - "$PUBLISH_VERSION" <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = process.argv[2];
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          elif [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "v$BASE_VERSION" ]]; then
              echo "::error::标签 $REF_NAME 必须与 v$BASE_VERSION 完全一致"
              exit 1
            fi
            PUBLISH_VERSION="$BASE_VERSION"
            DIST_TAG="latest"
          else
            echo "::error::不支持的引用类型：$REF_TYPE"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: pnpm run build
      - name: Regression tests
        run: pnpm test
      - name: Inspect npm package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Check whether the version already exists
        id: published
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if QUERY_OUTPUT="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$NPM_REGISTRY" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION 已发布，跳过重复发布。"
          elif grep -q 'E404' <<< "$QUERY_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$QUERY_OUTPUT" >&2
            exit 1
          fi
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG" --access public --ignore-scripts

  dump-latest:
    name: Update npm latest and next patch version
    needs: publish
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-latest-metadata
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dump npm latest metadata
        run: node scripts/dump-npm-latest.mjs
      - name: Bump next patch version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/bump-next-patch.mjs
      - name: Commit npm metadata and next patch version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm-latest.json package.json
          for lockfile in package-lock.json npm-shrinkwrap.json; do
            if [ -f "$lockfile" ]; then
              git add "$lockfile"
            fi
          done
          if git diff --cached --quiet; then
            echo "正式版元数据与版本号未变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore(release): 更新正式版元数据并递增 patch [skip ci]"
          git push origin HEAD:main
